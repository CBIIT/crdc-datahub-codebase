name: Build Images for CRDC DH
permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build from Github Actions
        type: environment
        default: build
      build:
        description: build docker images
        required: true
        type: boolean
        default: true
      twistlock_scan:
        description: "Run Twistlock Scan"
        required: true
        type: boolean
        default: true
      trivy_scan:
        description: "Run Trivy Scan"
        required: true
        type: boolean
        default: true
run-name: "Build Docker Images for CRDC DH"

jobs:

  # ──────────────────────────────────────────────
  # Job 1: Compute the image tag once, share it
  # ──────────────────────────────────────────────
  prepare:
    name: Prepare Image Tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive
          clean: true
          fetch-depth: 0

      - name: Extract branch name and set image tag
        id: set_tag
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          echo "Current branch is: $BRANCH_NAME"
          git fetch --tags --force --quiet
          #tag=$(git tag -l $BRANCH_NAME* | sort -V | tail -1)
          tag=$(git ls-remote --tags origin "$BRANCH_NAME.*" \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | sort -V \
            | tail -1)
          echo "Latest git tag: $tag" 
          if [ ! -z "$tag" ]; then
            build_num=$(echo "${tag##*.}")
            build_num=$((build_num+1))
          else
            build_num=1
          fi
          IMAGE_TAG="$BRANCH_NAME.$build_num"
          echo "IMAGE_TAG=$IMAGE_TAG"

          # Tag the commit immediately so the next run always sees it, even if the build fails
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag $IMAGE_TAG
          git push origin $IMAGE_TAG

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # Job 2: Build + Trivy scan + Push each image in parallel
  # ──────────────────────────────────────────────
  build:
    name: Build, Scan and Push - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: prepare
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      REGION: "us-east-1"
    strategy:
      fail-fast: false   # let all matrix jobs run even if one fails
      matrix:
        include:
          - name: authn
            ecr_repo: crdc-hub-authn
            dockerfile: apps/authn/Dockerfile
            context: apps/authn
          - name: backend
            ecr_repo: crdc-hub-backend
            dockerfile: apps/backend/Dockerfile
            context: apps/backend
          - name: frontend
            ecr_repo: crdc-hub-frontend
            dockerfile: apps/frontend/Dockerfile
            context: apps/frontend
          - name: chatbot-backend
            ecr_repo: crdc-hub-chatbot-be
            dockerfile: apps/chatbot-backend/Dockerfile
            context: apps/chatbot-backend
          - name: essential-validation
            ecr_repo: crdc-hub-essentialvalidation
            dockerfile: apps/validator/essentialvalidation.dockerfile
            context: apps/validator
          - name: export-validation
            ecr_repo: crdc-hub-exportvalidation
            dockerfile: apps/validator/export.dockerfile
            context: apps/validator
          - name: file-validation
            ecr_repo: crdc-hub-filevalidation
            dockerfile: apps/validator/filevalidation.dockerfile
            context: apps/validator
          - name: metadata-validation
            ecr_repo: crdc-hub-metadatavalidation
            dockerfile: apps/validator/metadatavalidation.dockerfile
            context: apps/validator
          - name: pv-puller
            ecr_repo: crdc-hub-pvpuller
            dockerfile: apps/validator/pv_puller.dockerfile
            context: apps/validator

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          submodules: true

      - name: Set image name
        run: |
          echo "IMAGE_NAME=${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ matrix.ecr_repo }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: copy db-driver subfolders (for authn and BE)
        if: ${{ matrix.name == 'authn' || matrix.name == 'backend' }}
        run: |
          cp -rL lib/db-driver/. ${{ matrix.context }}/tmp-crdc-datahub-database-drivers/
          rm -rf ${{ matrix.context }}/crdc-datahub-database-drivers
          mv ${{ matrix.context }}/tmp-crdc-datahub-database-drivers ${{ matrix.context }}/crdc-datahub-database-drivers

      - name: copy bento-common subfolders (for validator & pvpuller)
        if: ${{ matrix.name == 'essential-validation' || matrix.name == 'export-validation' || matrix.name == 'file-validation' || matrix.name == 'metadata-validation' || matrix.name == 'pv-puller' }}
        run: |
          cp -rL lib/bento-common/. ${{ matrix.context }}/src/tmp-bento/
          rm -rf ${{ matrix.context }}/src/bento
          mv ${{ matrix.context }}/src/tmp-bento ${{ matrix.context }}/src/bento

      - name: Build Docker Image
        run: |
          docker build --no-cache \
            -t $IMAGE_NAME \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.context }}

      - name: clean up db-driver
        if: ${{ matrix.name == 'authn' || matrix.name == 'backend' }}
        run: |
          rm -rf ${{ matrix.context }}/crdc-datahub-database-drivers/
  
      - name: clean up bento-common subfolders (for validator & pvpuller)
        if: ${{ matrix.name == 'essential-validation' || matrix.name == 'export-validation' || matrix.name == 'file-validation' || matrix.name == 'metadata-validation' || matrix.name == 'pv-puller' }}
        run: |
          rm -rf ${{ matrix.context }}/src/bento/

      - name: Run Trivy Scan
        if: ${{ inputs.trivy_scan == true }}
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          echo "========================================"
          echo "Scanning: $IMAGE_NAME"
          echo "========================================"
          trivy image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --no-progress \
            --format table \
            "$IMAGE_NAME"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        run: |
          REGISTRY_URL="${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY_URL

      - name: Push Image to ECR
        run: |
          echo "Pushing: $IMAGE_NAME"
          docker push $IMAGE_NAME

  # ──────────────────────────────────────────────
  # Job 3: Twistlock Scan - runs after build/push completes
  # ──────────────────────────────────────────────
  twistlock_scan:
    name: Twistlock Scan - ${{ matrix.name }}
    runs-on:
      group: cbiit-global-runners
      labels: [nonprod-org-runner]
    needs: [prepare, build]
    if: needs.build.result == 'success' && inputs.twistlock_scan == true
    environment: ${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      REGION: "us-east-1"
      TWISTLOCK_URL: "https://twistlock.nci.nih.gov"
      TWISTLOCK_PATH: "/opt/twistlock/twistcli"
    strategy:
      fail-fast: false
      #max-parallel: 1
      matrix:
        include:
          - name: authn
            ecr_repo: crdc-hub-authn
          - name: backend
            ecr_repo: crdc-hub-backend
          - name: frontend
            ecr_repo: crdc-hub-frontend
          - name: chatbot-backend
            ecr_repo: crdc-hub-chatbot-be
          - name: essential-validation
            ecr_repo: crdc-hub-essentialvalidation
          - name: export-validation
            ecr_repo: crdc-hub-exportvalidation
          - name: file-validation
            ecr_repo: crdc-hub-filevalidation
          - name: metadata-validation
            ecr_repo: crdc-hub-metadatavalidation
          - name: pv-puller
            ecr_repo: crdc-hub-pvpuller
    outputs:
      backend_scan_result: ${{ steps.set_scan_output.outputs.scan_result }}
    steps:
      - name: Set image name
        run: |
          uname -a
          cat /etc/os-release
          systemctl status docker  
          echo "IMAGE_NAME=${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ matrix.ecr_repo }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        run: |
          REGISTRY_URL="${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY_URL

      - name: Pull Image from ECR
        run: |
          echo "Pulling: $IMAGE_NAME"
          docker pull $IMAGE_NAME

      - name: Download Twistlock CLI (twistcli) to runner
        run: |
          set -Eeuo pipefail

          TWISTLOCK_PATH="${RUNNER_TEMP}/twistcli"

          curl --fail --silent --show-error --location --insecure -u "${{ secrets.TWISTLOCK_USERNAME }}:${{ secrets.TWISTLOCK_PASSWORD }}" --output "${TWISTLOCK_PATH}" "${TWISTLOCK_URL}/api/v1/util/twistcli"
          test -s "${TWISTLOCK_PATH}"
          chmod 0755 "${TWISTLOCK_PATH}"

          echo "TWISTLOCK_PATH=${TWISTLOCK_PATH}" >> "$GITHUB_ENV"

          echo "Downloaded TwistCLI:"
          ls -lh "${TWISTLOCK_PATH}"
          "${TWISTLOCK_PATH}" --version

          docker image prune --all --force --filter "until=24h"
          #docker image prune --all --force

          df -h
          docker system df

      - name: Run Twistlock Scan
        id: twistlock_scan
        run: |
          set -uo pipefail
          SCAN_LOG="scan-output-${{ matrix.name }}.log"
          SCAN_JSON="scan-${{ matrix.name }}.json"

          set +e
          echo "========================================"
          echo "Scanning: $IMAGE_NAME"
          echo "========================================"
          ${TWISTLOCK_PATH} images scan \
            --address "${TWISTLOCK_URL}" \
            --user "${{ secrets.TWISTLOCK_USERNAME }}" \
            --password "${{ secrets.TWISTLOCK_PASSWORD }}" \
            --output-file "scan-${{ matrix.name }}.json" \
            "$IMAGE_NAME" \
            2>&1 | tee scan-output-${{ matrix.name }}.log

            SCAN_EXIT_CODE=${PIPESTATUS[0]}

          set -e

          {
            echo
            echo "========================================"
            echo "End: $(date --utc --iso-8601=seconds)"
            echo "TwistCLI exit code: $SCAN_EXIT_CODE"
            echo "========================================"
          } | tee -a "$SCAN_LOG"

          echo "Checking Console immediately after scan:"
          POST_SCAN_HTTP_CODE=$(
            curl --silent \
              --show-error \
              --insecure \
              --connect-timeout 10 \
              --max-time 30 \
              --output /dev/null \
              --write-out '%{http_code}' \
              -u "${{ secrets.TWISTLOCK_USERNAME }}:${{ secrets.TWISTLOCK_PASSWORD }}" \
              "${TWISTLOCK_URL}/api/v1/version" \
              || true
          )

          echo "Post-scan Console HTTP status: ${POST_SCAN_HTTP_CODE:-unreachable}" \
            | tee -a "$SCAN_LOG"

          echo "SCAN_EXIT_CODE=$SCAN_EXIT_CODE" >> "$GITHUB_ENV"
          exit "$SCAN_EXIT_CODE"


      - name: Format scan results as table
        if: always()
        run: |
          python3 - "scan-${{ matrix.name }}.json" "${{ matrix.name }}" << 'PYEOF'
          import json
          import os
          import sys

          scan_file, image_label = sys.argv[1], sys.argv[2]
          gh_output_path = os.environ["GITHUB_OUTPUT"]

          try:
              with open(scan_file) as f:
                  data = json.load(f)
          except Exception as e:
              print(f"Could not read/parse {scan_file}: {e}")
              #with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              with open(gh_output_path, "a") as gh_out:
                  gh_out.write("critical_count=0\n")
                  gh_out.write("high_count=0\n")
                  gh_out.write("has_critical_or_high=false\n")
              sys.exit(0)

          results = data if isinstance(data, list) else data.get("results", [data])

          rows = []
          sev_counts = {"critical": 0, "high": 0, "medium": 0, "low": 0}

          for result in results:
              vulns = result.get("vulnerabilities") or []
              for v in vulns:
                  sev = (v.get("severity") or "unknown").lower()
                  if sev in sev_counts:
                      sev_counts[sev] += 1
                  rows.append({
                      "package": v.get("packageName", v.get("id", "")),
                      "cve": v.get("cve") or v.get("id", ""),
                      "severity": (v.get("severity") or "").upper(),
                      "status": v.get("status", "fixed" if v.get("fixDate") else "affected"),
                      "installed": v.get("packageVersion", ""),
                      "fixed": v.get("fixedVersion") or v.get("fixDate", "not fixed"),
                  })

          total = len(rows)
          summary = f"Total: {total} (CRITICAL: {sev_counts['critical']}, HIGH: {sev_counts['high']}, MEDIUM: {sev_counts['medium']}, LOW: {sev_counts['low']})"

          print("=" * 100)
          print(f"Twistlock Scan Results: {image_label}")
          print("=" * 100)
          print(summary)
          print()

          if not rows:
              print("No vulnerabilities found.")
          else:
              cols = ["package", "cve", "severity", "status", "installed", "fixed"]
              headers = ["Library", "Vulnerability", "Severity", "Status", "Installed Version", "Fixed Version"]
              widths = [max(len(h), max((len(str(r[c])) for r in rows), default=0)) for h, c in zip(headers, cols)]

              def line(char="-"):
                  return "+" + "+".join(char * (w + 2) for w in widths) + "+"

              def fmt_row(vals):
                  return "| " + " | ".join(str(v).ljust(w) for v, w in zip(vals, widths)) + " |"

              print(line())
              print(fmt_row(headers))
              print(line())
              for r in rows:
                  print(fmt_row([r[c] for c in cols]))
              print(line())

          with open(f"scan-table-{image_label}.txt", "w") as out:
              out.write(summary + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"critical_count={sev_counts['critical']}\n")
              gh_out.write(f"high_count={sev_counts['high']}\n")
              gh_out.write(f"medium_count={sev_counts['medium']}\n")
              gh_out.write(f"low_count={sev_counts['low']}\n")
              gh_out.write(f"has_critical_or_high={has_critical_or_high}\n")

          PYEOF

      - name: Write scan result summary file
        if: always()
        run: |
          cat > "result-${{ matrix.name }}.json" << EOF
          {
            "image": "${{ matrix.name }}",
            "critical": ${{ steps.format_table.outputs.critical_count || 0 }},
            "high": ${{ steps.format_table.outputs.high_count || 0 }},
            "medium": ${{ steps.format_table.outputs.medium_count || 0 }},
            "low": ${{ steps.format_table.outputs.low_count || 0 }},
            "has_critical_or_high": "${{ steps.format_table.outputs.has_critical_or_high || 'false' }}"
          }
          EOF
          cat "result-${{ matrix.name }}.json"

      - name: Upload per-image result summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twistlock-result-${{ matrix.name }}
          path: result-${{ matrix.name }}.json
          retention-days: 2

      - name: Set scan result output
        id: set_scan_output
        if: always()
        run: |
          if [ -f "scan-${{ matrix.name }}.json" ]; then
            SCAN_SUMMARY=$(cat "scan-${{ matrix.name }}.json" | tr -d '\n' | tr -d '\r')
          else
            SCAN_SUMMARY="Scan output file not found for ${{ matrix.name }}"
          fi
          {
            echo "scan_result<<EOF"
            echo "$SCAN_SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twistlock-scan-${{ matrix.name }}
          path: |
            scan-${{ matrix.name }}.json
            scan-output-${{ matrix.name }}.log
            scan-table-${{ matrix.name }}.txt
          retention-days: 2

  # ──────────────────────────────────────────────
  # Job 4: Twistlock Scan Summary - combine results, fail on critical/high
  # ──────────────────────────────────────────────
  twistlock_summary:
    name: Twistlock Scan Summary
    runs-on: ubuntu-latest
    needs: [twistlock_scan]
    if: always() && needs.twistlock_scan.result != 'skipped'
    steps:
      - name: Download all per-image result summaries
        uses: actions/download-artifact@v4
        with:
          pattern: twistlock-result-*
          path: results
          merge-multiple: true

      - name: Build combined summary and evaluate pass/fail
        run: |
          python3 - << 'PYEOF'
          import glob
          import json
          import os

          files = sorted(glob.glob("results/*.json"))
          rows = []
          any_fail = False

          for fpath in files:
              try:
                  with open(fpath) as f:
                      rows.append(json.load(f))
              except Exception as e:
                  print(f"Could not read {fpath}: {e}")

          lines = []
          lines.append("## \U0001F512 Twistlock Scan Results\n")
          lines.append("| Image | Critical | High | Medium | Low | Status |")
          lines.append("|---|---|---|---|---|---|")

          for r in rows:
              crit = r.get("critical", 0)
              high = r.get("high", 0)
              med = r.get("medium", 0)
              low = r.get("low", 0)
              failed = r.get("has_critical_or_high") == "true"
              if failed:
                  any_fail = True
              status = "\u274C FAIL" if failed else "\u2705 PASS"
              lines.append(f"| {r.get('image','?')} | {crit} | {high} | {med} | {low} | {status} |")

          lines.append("")
          if any_fail:
              lines.append("\u274C **One or more images have CRITICAL or HIGH vulnerabilities.**")
          else:
              lines.append("\u2705 **No CRITICAL or HIGH vulnerabilities found across all images.**")

          summary_md = "\n".join(lines)
          print(summary_md)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary_md + "\n")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ANY_CRITICAL_OR_HIGH={'true' if any_fail else 'false'}\n")
          PYEOF

      - name: Fail if any image has critical/high vulnerabilities
        #if: env.ANY_CRITICAL_OR_HIGH == 'true'
        if: needs.twistlock_scan.result == 'failure'
        run: |
          echo "Failing build: one or more images have CRITICAL or HIGH vulnerabilities."
          exit 1        

  # ──────────────────────────────────────────────
  # Job 5: Slack notification (always runs)
  # ──────────────────────────────────────────────
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [build, twistlock_scan, twistlock_summary]
    if: always()
    steps:
      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: act10ns/slack@87c73aef9f8838eb6feae81589a6b1487a4a9e08  # v1.6.0
        with:
          status: ${{ needs.build.result }}
